<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — Eira</title>
  <link rel="canonical" href="https://eira.example/category.html" />
  <meta name="description" content="Browse Eira Journal stories about self discovery, life and beauty." />

  <!-- Open Graph / Pinterest Rich Pins -->
  <meta property="og:site_name" content="Eira" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Categories — Eira" />
  <meta property="og:description" content="Browse Eira Journal stories about self discovery, life and beauty." />
  <meta property="og:url" content="https://eira.example/category/" />
  <meta property="og:image" content="https://eira.example/pins/home-pin.svg" />
  <meta property="og:image:width" content="1000" />
  <meta property="og:image:height" content="1500" />
  <meta property="og:image:alt" content="Eira — category hub" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Categories — Eira" />
  <meta name="twitter:description" content="Browse Eira Journal stories about self discovery, life and beauty." />
  <meta name="twitter:image" content="https://eira.example/pins/home-pin.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme-warm.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="Eira — home">Eira</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
      <nav id="primary-nav" class="nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="blog.html">Journal</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero category-hero">
      <div class="container container--narrow">
        <h1 id="category-heading">Categories</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="category-posts"><p class="muted" id="category-posts-loading">Loading posts…</p></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <p class="footer-brand">Eira</p>
          <p style="color: var(--color-accent-soft); max-width: 38ch;">An independent journal about self discovery, life and beauty — made for readers, not algorithms.</p>
        </div>
        <div class="footer-col">
          <h4>Categories</h4>
          <ul>
            <li><a href="blog.html?category=Self%20Discovery">Self Discovery</a></li>
            <li><a href="blog.html?category=Life">Life</a></li>
            <li><a href="blog.html?category=Beauty">Beauty</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&copy; 2026 Eira. All rights reserved.</span>
        <span>Made for readers, not algorithms.</span>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var nav = document.getElementById('primary-nav');
      if (!toggle || !nav) return;
      toggle.addEventListener('click', function () {
        var open = nav.getAttribute('data-open') === 'true';
        nav.setAttribute('data-open', String(!open));
        toggle.setAttribute('aria-expanded', String(!open));
      });
    })();

    // Load posts grouped by category, or filtered to a single category from URL.
    (function () {
      var container = document.getElementById('category-posts');
      var loading = document.getElementById('category-posts-loading');
      var heading = document.getElementById('category-heading');
      var params = new URLSearchParams(window.location.search);
      var filterCategory = params.get('category');
      function esc(s) { return String(s||'').replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
      function renderPostCard(p) {
        var meta = esc(p.read_time || '');
        var imgSrc = p.og_image ? esc(p.og_image) : '';
        var media = imgSrc
          ? '<a href="/post/' + esc(p.slug) + '/" style="text-decoration:none" class="card__media"><img src="' + imgSrc + '" alt="' + esc(p.image_alt || p.title) + '" loading="lazy" /></a>'
          : '<a href="/post/' + esc(p.slug) + '/" style="text-decoration:none" class="card__media">' + esc(p.category || 'Post') + '</a>';
        return '<article class="card">' + media +
          '<div class="card__body">' +
            (meta ? '<p class="card__meta">' + meta + '</p>' : '') +
            '<h3 class="card__title"><a href="/post/' + esc(p.slug) + '/">' + esc(p.title) + '</a></h3>' +
          '</div>' +
        '</article>';
      }
      function renderCategoryPosts(posts) {
        if (filterCategory) {
          // Single category view
          var filteredPosts = posts.filter(function (p) { return p.category === filterCategory; });
          if (heading) heading.textContent = esc(filterCategory);
          var html = '';
          if (filteredPosts.length === 0) {
            container.innerHTML = '<p class="muted">No stories in ' + esc(filterCategory) + ' yet.</p>';
            return;
          }
          if (filteredPosts.length > 0) {
            html += '<div class="grid grid--posts">' + filteredPosts.map(renderPostCard).join('') + '</div>';
          }
          container.innerHTML = html;
          return;
        }
        // All categories view
        var groupedPosts = {};
        var postOrder = [];
        posts.forEach(function (p) {
          var cat = p.category || 'Uncategorized';
          if (!groupedPosts[cat]) { groupedPosts[cat] = []; postOrder.push(cat); }
          groupedPosts[cat].push(p);
        });
        container.innerHTML = postOrder.map(function (cat) {
          return '<h2 style="margin-top: var(--space-12);">' + esc(cat) + '</h2>' +
            '<div class="grid grid--posts">' + groupedPosts[cat].map(renderPostCard).join('') + '</div>';
        }).join('');
      }
      fetch('/api/posts?published=1').then(function (r) { return r.json(); })
        .then(function (result) {
          var posts = (result.posts || []).filter(function (p) { return ['Self Discovery', 'Life', 'Beauty'].indexOf(p.category) !== -1; });
          if (loading) loading.remove();
          if (posts.length === 0) {
            container.innerHTML = '<p class="muted">No stories yet.</p>';
            return;
          }
          renderCategoryPosts(posts);
        })
        .catch(function () {
          if (loading) loading.remove();
          container.innerHTML = '<p class="muted">Unable to load stories.</p>';
        });
    })();
  </script>
</body>
</html>
